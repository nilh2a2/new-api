name: Publish fork Docker image

on:
  push:
    branches:
      - codex/simplify
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag prefix"
        required: false
        default: "simplify"
        type: string

jobs:
  prepare:
    name: Prepare fork image metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag_prefix: ${{ steps.meta.outputs.tag_prefix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG_PREFIX="${{ github.event.inputs.tag || 'simplify' }}"
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing fork image: $IMAGE:$VERSION"

  build_single_arch:
    name: Build & push fork image (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write image version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "$VERSION" > VERSION
          echo "TAG_PREFIX=${{ needs.prepare.outputs.tag_prefix }}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing fork image: ${{ needs.prepare.outputs.image }}:$VERSION for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Image summary
        run: |
          echo "### Fork Docker Image Digest (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.prepare.outputs.image }}:${TAG_PREFIX}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.prepare.outputs.image }}:${VERSION}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifest:
    name: Create fork multi-arch manifest
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Set manifest variables
        run: |
          echo "IMAGE=${{ needs.prepare.outputs.image }}" >> "$GITHUB_ENV"
          echo "TAG_PREFIX=${{ needs.prepare.outputs.tag_prefix }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG_PREFIX}" \
            "${IMAGE}:${TAG_PREFIX}-amd64" \
            "${IMAGE}:${TAG_PREFIX}-arm64"

      - name: Create & push versioned manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Manifest summary
        run: |
          echo "### Fork Multi-arch Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
